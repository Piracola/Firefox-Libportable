# Firefox 便携版构建
#
# 实际流程全部在 Browser-builder 的可复用工作流里，这里只负责触发条件和参数。
# 需要调整构建逻辑时，请改 https://github.com/Piracola/Browser-builder
name: Firefox Portable Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * *'

# 定时任务和 push 撞在一起时排队执行，避免两个构建抢同一个 Release 标签。
concurrency:
  group: build-firefox
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: Piracola/Browser-builder/.github/workflows/build-portable.yml@main
    with:
      browser: firefox
      # 想发布中文版 Firefox，把这里改成 zh-CN 即可。
      lang: en-US
      release-notes-url: 'https://www.mozilla.org/en-US/firefox/{version}/releasenotes/'
